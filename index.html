<!doctype html>
<html lang="es-CL">
<head>

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <a class="skip-link" href="#app">Saltar al contenido</a>

  <header class="site-header">
    <a class="logo" href="#/"><span class="logo__ico" data-icon="cart"></span>¿Qué compro?</a>
    <span class="tape tape--sm tape--mint header__prices">Precios <span id="prices-date">2026-09</span></span>
  </header>

  <main id="app" tabindex="-1">
    <noscript><p class="card">¿Qué compro? necesita JavaScript para calcular tu lista.</p></noscript>
  </main>

  <div class="lace" aria-hidden="true"></div>
  <footer class="site-footer wood">
    <p class="logo logo--footer">¿Qué compro?</p>

  </footer>

  <div class="toast" id="toast" aria-hidden="true"></div>
  <p class="sr-only" id="live" aria-live="polite"></p>

  <!-- Ficha de un corte (botón ⓘ en el paso de carnes) -->
  <dialog class="sheet" id="sheet" aria-labelledby="sheet-title"></dialog>

  <!-- Scripts clásicos (sin módulos ES) para que funcione abriendo el archivo directo -->
  <script src="js/icons.js"></script>
  <script src="js/util.js"></script>
  <!-- Catálogo (precios de respaldo) y, encima, los precios reales del scraper -->

  <script src="data/products/bazar.js"></script>
  <script src="data/products/bebidas.js"></script>

  <script src="data/products/despensa.js"></script>
  <script src="data/products/fiambreria.js"></script>

  <script src="data/products/snacks.js"></script>

  <!-- Escenarios (en el orden en que aparecen en el inicio) -->

  <script src="data/scenarios/pan.js"></script>
  <script src="data/scenarios/picoteo.js"></script>
  <script src="data/scenarios/completos.js"></script>
  <script src="data/scenarios/carrete.js"></script>
  <script src="data/scenarios/tabla.js"></script>
  <script src="data/scenarios/brunch.js"></script>
  <script src="data/cuts.js"></script>
